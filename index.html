<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CARTYX</title>
<meta http-equiv="refresh" content="3; url=https://cartyx.tailfec08a.ts.net">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c2533; color: #fff;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 28px; letter-spacing: .08em; margin: 18px 0 6px; }
  h1 span { color: #5cc08f; }
  p { color: #c6d4df; margin: 6px 0; }
  .giro { width: 38px; height: 38px; margin: 0 auto; border: 4px solid rgba(255,255,255,.15);
          border-top-color: #5cc08f; border-radius: 50%; animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  a { display: inline-block; margin-top: 18px; padding: 10px 18px; border-radius: 10px; background: #1e6d4a;
      color: #fff; text-decoration: none; font-weight: 600; }
  small { display: block; margin-top: 22px; color: #6b8ba4; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="giro" aria-hidden="true"></div>
  <h1>CARTY<span>X</span></h1>
  <p>Datos en terreno, decisiones inteligentes.</p>
  <p>Abriendo el sistema…</p>
  <a id="ir" href="https://cartyx.tailfec08a.ts.net">Entrar a CARTYX</a>
  <small>Actualizado: 2026-09-25 21:17</small>
</main>
<script>
  // Conserva la ruta pedida (p. ej. cartyxzipaquira.github.io/tareas → …/tareas)
  var base = "https://cartyx.tailfec08a.ts.net";
  var ruta = location.pathname + location.search + location.hash;
  if (ruta === "/" || ruta === "/index.html") ruta = "";
  var destino = base + ruta;
  document.getElementById("ir").href = destino;
  location.replace(destino);
</script>
</body>
</html>
