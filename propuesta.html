<script>
  var BASES = ["https://cartyx.tailfec08a.ts.net","https://shuttle-strengthening-ambient-listprice.trycloudflare.com"];
  var t = new URLSearchParams(location.search).get("t") || "";
  var ruta = /^[A-Za-z0-9_-]{16,64}$/.test(t) ? "/p/" + t : null;
  var intentos = 0;
  function probar() {
    intentos++;
    var listo = false, fallas = 0;
    BASES.forEach(function (base) {
      var control = "AbortController" in window ? new AbortController() : null;
      var reloj = setTimeout(function () { if (control) control.abort(); }, 7000);
      fetch(base + "/api/salud", { mode: "no-cors", cache: "no-store", signal: control ? control.signal : undefined })
        .then(function () { clearTimeout(reloj); if (!listo) { listo = true; location.replace(base + ruta); } })
        .catch(function () {
          clearTimeout(reloj);
          if (++fallas < BASES.length || listo) return;
          document.getElementById("espera").style.display = "block";
          if (intentos >= 3) document.getElementById("ayuda").style.display = "block";
          setTimeout(probar, 10000);
        });
    });
  }
  document.getElementById("otra").onclick = function () { probar(); };
  if (ruta === null) document.getElementById("titulo").textContent = "Este enlace no es válido";
  else if (!("fetch" in window)) location.replace(BASES[0] + ruta);
  else probar();
</script>
